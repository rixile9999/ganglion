[project]
name = "ganglion"
version = "0.1.0"
description = "Ganglion: compiler-guided optimization for LLM tool calling via compact Action IRs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pii = ["pynacl>=1.6"]
pii-model = ["pynacl>=1.6", "torch>=2.4", "transformers>=5.2", "safetensors>=0.5", "peft>=0.20"]
dev = [
    "pytest>=8.0.0",
]
factory = [
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "datasets>=3.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "xgrammar>=0.2.0",
]
factory-gpu = [
    "bitsandbytes>=0.44",
]

[project.scripts]
ganglion = "ganglion.ctl.main:main"

[tool.setuptools.packages.find]
include = ["ganglion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
